<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="logo">🏠 HostelEase</div>
</nav>

<!-- ================= LOGIN PAGE ================= -->
<div class="login-page">

  <div class="login-card">

    <h2>🔐 Login</h2>
    <p class="subtitle">
      Enter your username and password to receive OTP
    </p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <!-- Username -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          name="username"
          [(ngModel)]="credentials.username"
          required
          placeholder="Enter username"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          placeholder="Enter password"
        />
      </div>

      <!-- Error Message -->
      <div class="status error" *ngIf="errorMessage">
        ❌ {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button
        class="login-btn"
        type="submit"
        [disabled]="loading || !loginForm.valid"
      >
        {{ loading ? 'Sending OTP...' : 'Login & Send OTP' }}
      </button>

    </form>

    <!-- Register -->
    <div class="register-link">
      Don’t have an account?
      <a (click)="goToRegister()">Register</a>
    </div>

  </div>

</div>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  <p>© 2026 HostelEase | Smart Hostel Management System</p>
</footer>
